name: Publish CLI to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'templates/**'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish regardless of version checks'
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from package.json
        id: extract
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted CLI version: $VERSION"

      - name: Check if version should be published
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if [ "${{ github.event.inputs.force_publish }}" == "true" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Force publish requested for version $VERSION"
            exit 0
          fi

          # Check if this version exists on npm
          if npm view "@grepr/cli@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on npm, skipping"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found on npm, will publish"
          fi

  publish-cli:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Upgrade npm for Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        env:
          REQUIRE_DOCS_INDEX: 'true'
          SKIP_DOCS_INDEX: 'false'
        run: |
          echo "Building CLI..."
          bun run build

          # Verify build output
          ls -la build/dist/
          echo "Verifying CLI executable..."
          node build/dist/grepr.js --version

      - name: Run tests
        run: bun run test

      - name: Create distributions
        run: |
          echo "Creating distribution packages..."
          SKIP_CLI_BUILD=true ./scripts/create-distributions.sh

          echo "Created distributions:"
          ls -la build/customer-distributions/

      - name: Pack and smoke-test npm artifact
        id: package
        run: |
          set -euo pipefail
          mkdir -p build/npm-package build/npm-smoke
          ARCHIVE=$(npm pack --ignore-scripts --pack-destination build/npm-package --silent)
          TARBALL="$PWD/build/npm-package/$ARCHIVE"

          npm install --prefix build/npm-smoke "$TARBALL"
          INSTALLED="$PWD/build/npm-smoke/node_modules/@grepr/cli"

          test -f "$INSTALLED/build/dist/docs-index/catalog.json"
          test -f "$INSTALLED/THIRD_PARTY_NOTICES.md"
          test -f "$INSTALLED/LICENSES/Apache-2.0.txt"
          test -f "$INSTALLED/build/dist/models/Xenova/all-MiniLM-L6-v2/751bff37182d3f1213fa05d7196b954e230abad9/onnx/model_quantized.onnx"

          "$PWD/build/npm-smoke/node_modules/.bin/grepr" \
            docs:get doc://tutorials/first-pipeline/page.mdx > build/npm-smoke/docs-get.txt
          "$PWD/build/npm-smoke/node_modules/.bin/grepr" \
            docs:search "create a pipeline" --format compact --limit 2 > build/npm-smoke/docs-search.txt
          grep -q 'doc://' build/npm-smoke/docs-search.txt

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          echo "Publishing @grepr/cli@$VERSION to npm..."
          # Prerelease versions (containing a hyphen) need an explicit dist-tag.
          # npm@11 refuses to publish prereleases without --tag because the
          # default "latest" would surface a prerelease to plain npm install.
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          npm publish "${{ steps.package.outputs.tarball }}" \
            --ignore-scripts --access public --provenance --tag "$DIST_TAG"
          echo "Successfully published @grepr/cli@$VERSION to dist-tag '$DIST_TAG'"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: CLI v${{ needs.check-version.outputs.version }}
          body: |
            # Grepr CLI v${{ needs.check-version.outputs.version }}

            ## Installation

            ```bash
            npm install -g @grepr/cli
            ```

            ## What's Changed

            This release was automatically synced from grepr-server and published to npm.

            See commit history for detailed changes.
          files: |
            build/customer-distributions/grepr-v${{ needs.check-version.outputs.version }}.tar.gz
            build/customer-distributions/grepr-source-v${{ needs.check-version.outputs.version }}.tar.gz
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.version, '-') }}

      - name: Summary
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "## ✅ CLI Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Version \`$VERSION\` published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [npm package](https://www.npmjs.com/package/@grepr/cli)" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub release](https://github.com/grepr/grepr-cli/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
