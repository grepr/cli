version: 2
updates:
  # No npm entry: grepr-cli-sync.yml in grepr-server overwrites package.json and bun.lock here.
  # Make npm dependency changes in grepr-server cli/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
